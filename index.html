<body> 
    <div class="container"> 
        <h1>MEQTEADOMAINS Dashboard</h1> 
        <div class="card"> 
            <h2>Domain Availability Check</h2> 
            <p>Enter a domain name or base label and this portal will check common TLDs like <strong>.com</strong>, <strong>.net</strong>, <strong>.org</strong>, <strong>.co</strong> and more.</p> 
            <form id="domainForm"> 
                <input type="text" id="domainInput" placeholder="Enter base name or domain (e.g., meqeta or meqeta.com)" required> 
                <button type="submit">Check Availability</button> 
            </form> 
            <div id="result"></div> 
            <div id="availabilityTable"></div> 
        </div> 
        <div class="card"> 
            <h2>Set Default Margins</h2> 
            <form id="marginForm"> 
                <input type="number" id="marginInput" placeholder="Margin percentage (e.g., 20)" required> 
                <button type="submit">Save Margin</button> 
            </form> 
            <div id="marginResult"></div> 
        </div> 
    </div> 
    <script src="scripts/main.js"></script>

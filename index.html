<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEQETA DOMAINS</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles/main.css">
</head>

<body>

<!-- NAVBAR -->
<nav id="mainNavbar" class="navbar navbar-expand-lg px-4">
    <a class="navbar-brand fw-bold" href="#">🚀 MEQETA DOMAINS</a>

    <div class="ms-auto d-flex align-items-center gap-3">
        <div class="form-check form-switch m-0">
            <input class="form-check-input" type="checkbox" id="themeToggle">
            <label class="form-check-label small" id="themeLabel">🌙</label>
        </div>

        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#settingsModal">
            ⚙️
        </button>
    </div>
</nav>

<div class="container py-5">

    <!-- SEARCH SECTION -->
    <div class="card shadow-sm p-4 mb-4 search-card">
        <h4 class="mb-3">Domain Availability</h4>

        <form id="domainForm" class="d-flex gap-2">
            <input type="text" id="domainInput" class="form-control" placeholder="Enter domain (e.g. meqeta)">
            <button class="btn btn-primary">Check</button>
        </form>
    </div>

    <!-- RESULTS -->
    <div id="result"></div>
    <div id="availabilityTable" class="domain-results"></div>

</div>

<!-- SETTINGS MODAL -->
<div class="modal fade" id="settingsModal">
  <div class="modal-dialog">
    <div class="modal-content p-3">
      <h5>Settings</h5>

      <input type="number" id="marginInput" class="form-control my-2" placeholder="Enter margin %">
      <button id="saveMargin" class="btn btn-primary w-100">Save Margin</button>

      <div id="marginStatus" class="mt-2"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="scripts/main.js"></script>

</body>
</html>
